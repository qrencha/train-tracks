<!DOCTYPE html>
<html>

<head>
  <title>train tracks</title>
  <style>
    body {
      /* text-align: center; */
      padding: 0;
      margin: 10;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
  <script src="track.js"></script>
  <script src="mesh.js"></script>
  <script src="sketch.js"></script>

</head>

<body>
  <div id="inputMesh">

    <label>
      Rows:
      <input id="rows" type="number" min="1" value="4">
    </label>

    <label>
      Columns:
      <input id="cols" type="number" min="1" value="4">
    </label>

  </div>
  <div>
    <select id="startEdge">
      <option>BOTTOM</option>
      <option>TOP</option>
      <option>LEFT</option>
      <option>RIGHT</option>
    </select>
  </div>
  <div>
    <button id="createMeshButton" onclick="createMesh()">Create Mesh
    </button>
  </div>

</body>

</html>
